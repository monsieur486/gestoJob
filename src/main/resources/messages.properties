# Messages des erreurs de conversion des formulaires (chargés automatiquement par
# Spring Boot : spring.messages.basename=messages, encodage UTF-8 par défaut).
# Sans eux, une valeur non convertible affiche le message technique anglais de
# Spring (« Failed to convert property value… »). Les messages de validation
# (@NotNull, @Size…) restent portés par les annotations des formulaires.
# Clés résolues du plus précis au plus général : typeMismatch.<objet>.<champ>,
# typeMismatch.<champ>, typeMismatch.<type>, typeMismatch.

# Journal des offres consultées (OffreConsulteeForm).
typeMismatch.dateConsultation=La date est invalide.
typeMismatch.motifEcart=Motif inconnu.

# Repli pour tout autre champ de l'application.
typeMismatch=Valeur invalide.
