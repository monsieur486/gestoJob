<!DOCTYPE HTML>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GestoJob</title>
    <div th:replace="~{fragments/header :: header-css}"></div>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet"
          integrity="sha384-ecIckRi4QlKYya/FQUbBUjS4qp65jF/J87Guw5uzTbO1C1Jfa/6kYmd6dXUF6D7i"
          crossorigin="anonymous"/>
    <style>
        /* Police d'édition agrandie (~x2) pour la lisibilité, sur cette page uniquement. */
        .ql-container.ql-snow { font-size: 1.6rem; }
        .ql-editor { line-height: 1.5; }
        .container-fluid .form-control { font-size: 1.6rem; }
    </style>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container-fluid">
    <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}">OK</div>
    <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}">Erreur</div>
    <h3>Paramètres — profil</h3>

    <div class="card mb-4">
        <div class="card-header">Profil du candidat et lettres</div>
        <div class="card-body">
            <form method="post" th:action="@{/parametres/profil}" th:object="${profilForm}">
                <div class="mb-3">
                    <label class="form-label" for="candidatNom">Nom du candidat</label>
                    <input class="form-control" id="candidatNom" th:field="*{candidatNom}" type="text"/>
                    <div class="text-danger" th:errors="*{candidatNom}"></div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="libelleGeneral">Libellé — Lettre 1</label>
                        <input class="form-control" id="libelleGeneral" th:field="*{libelleGeneral}" type="text"/>
                        <div class="text-danger" th:errors="*{libelleGeneral}"></div>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="form-label" for="posteGeneral">Poste par défaut — Lettre 1</label>
                        <input class="form-control" id="posteGeneral" th:field="*{posteGeneral}" type="text"/>
                        <div class="text-danger" th:errors="*{posteGeneral}"></div>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="libelleMicroservices">Libellé — Lettre 2</label>
                        <input class="form-control" id="libelleMicroservices" th:field="*{libelleMicroservices}" type="text"/>
                        <div class="text-danger" th:errors="*{libelleMicroservices}"></div>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="form-label" for="posteMicroservices">Poste par défaut — Lettre 2</label>
                        <input class="form-control" id="posteMicroservices" th:field="*{posteMicroservices}" type="text"/>
                        <div class="text-danger" th:errors="*{posteMicroservices}"></div>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="libelleIa">Libellé — Lettre 3</label>
                        <input class="form-control" id="libelleIa" th:field="*{libelleIa}" type="text"/>
                        <div class="text-danger" th:errors="*{libelleIa}"></div>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="form-label" for="posteIa">Poste par défaut — Lettre 3</label>
                        <input class="form-control" id="posteIa" th:field="*{posteIa}" type="text"/>
                        <div class="text-danger" th:errors="*{posteIa}"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Enregistrer le profil</button>
            </form>
        </div>
    </div>

    <h3>Paramètres — modèles d&apos;email</h3>

    <div class="card mb-4" th:each="modele : ${modeles}">
        <div class="card-header" th:text="${modele.libelleUi}">Modèle</div>
        <div class="card-body">
            <form method="post" th:action="@{'/parametres/modeles/' + ${modele.cle}}">
                <!-- Contenu HTML : éditeur Quill + champ caché rempli à la soumission -->
                <div th:if="${modele.html}">
                    <div class="editeur-modele" th:attr="data-cible='champ_' + ${modele.cle}"
                         th:utext="${modele.contenu}"></div>
                    <input type="hidden" th:id="'champ_' + ${modele.cle}" name="contenu"
                           th:value="${modele.contenu}"/>
                </div>
                <!-- Libellé : texte brut -->
                <div th:unless="${modele.html}">
                    <input type="text" class="form-control" name="contenu" th:value="${modele.contenu}"/>
                </div>
                <small class="text-muted">Variables : <span th:text="${modele.variables}"></span></small>
                <div class="mt-2">
                    <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
                </div>
            </form>
            <form method="post" class="mt-2"
                  th:action="@{'/parametres/modeles/' + ${modele.cle} + '/reinitialiser'}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Réinitialiser</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"
        integrity="sha384-utBUCeG4SYaCm4m7GQZYr8Hy8Fpy3V4KGjBZaf4WTKOcwhCYpt/0PfeEe3HNlwx8"
        crossorigin="anonymous"></script>
<script src="" th:src="@{/js/main.js}" type="text/javascript"></script>
</body>
</html>
