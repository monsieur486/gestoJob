<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="header-css">
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <!-- Applique le mode mémorisé (sombre par défaut) avant le rendu : aucun flash
         de l'autre thème. Stockage inaccessible (navigation privée…) : sombre. -->
    <script>
        (function () {
            var theme = 'dark';
            try {
                var memorise = localStorage.getItem('gj-theme');
                if (memorise === 'light' || memorise === 'dark') theme = memorise;
            } catch (e) { /* stockage indisponible : on garde le sombre */ }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <script defer th:src="@{/js/theme.js}"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link
            crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            rel="stylesheet">
    <link href="" rel="stylesheet" th:href="@{/css/main.css}"/>
</div>
<!-- Bandeau affiché aux lecteurs (France Travail) : consultation seule. -->
<div th:fragment="bandeau">
    <div sec:authorize="hasRole('LECTEUR')" class="alert alert-info">Consultation — lecture seule (France Travail)</div>
</div>
</html>
