<!DOCTYPE HTML>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>GestoJob</title>
    <div th:replace="~{fragments/header :: header-css}"></div>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container-fluid">

    <div class="d-flex align-items-baseline justify-content-between mb-2">
        <h5 class="mb-0">
            Offres consultées
            <span class="text-muted"
                  th:if="${consulteesPage != null}"
                  th:text="'(' + ${consulteesPage.totalElements} + ' offre' + (${consulteesPage.totalElements} > 1 ? 's' : '') + ')'">
                (0 offre)
            </span>
        </h5>
    </div>
    <p class="text-muted small">Offres lues puis écartées sans candidature.</p>

    <!-- Saisie réservée au titulaire (les POST sont de toute façon refusés aux lecteurs). -->
    <form class="row g-2 align-items-end mb-3" method="post" sec:authorize="hasRole('TITULAIRE')"
          th:action="@{/consultees}" th:object="${form}">
        <div class="col-12 col-md-2">
            <label class="form-label" for="dateConsultation">Date</label>
            <input class="form-control" id="dateConsultation" th:field="*{dateConsultation}" type="date"
                   th:classappend="${#fields.hasErrors('dateConsultation')} ? ' is-invalid'" required>
            <div class="invalid-feedback" th:errors="*{dateConsultation}">Erreur</div>
        </div>
        <div class="col-12 col-md-4">
            <label class="form-label" for="intitule">Intitulé</label>
            <input class="form-control" id="intitule" maxlength="255" th:field="*{intitule}" type="text"
                   th:classappend="${#fields.hasErrors('intitule')} ? ' is-invalid'" required>
            <div class="invalid-feedback" th:errors="*{intitule}">Erreur</div>
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label" for="entreprise">Entreprise</label>
            <input class="form-control" id="entreprise" maxlength="255" th:field="*{entreprise}" type="text"
                   th:classappend="${#fields.hasErrors('entreprise')} ? ' is-invalid'" required>
            <div class="invalid-feedback" th:errors="*{entreprise}">Erreur</div>
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label" for="motifEcart">Motif de l'écart</label>
            <select class="form-select" id="motifEcart" th:field="*{motifEcart}"
                    th:classappend="${#fields.hasErrors('motifEcart')} ? ' is-invalid'" required>
                <option value="">— Choisir —</option>
                <option th:each="m : ${motifs}" th:text="${m.libelle}" th:value="${m.code}">Profil</option>
            </select>
            <div class="invalid-feedback" th:errors="*{motifEcart}">Erreur</div>
        </div>
        <div class="col-12 col-md-4">
            <label class="form-label" for="lien">Lien (facultatif)</label>
            <input class="form-control" id="lien" maxlength="1000" placeholder="https://..." th:field="*{lien}"
                   type="url" th:classappend="${#fields.hasErrors('lien')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{lien}">Erreur</div>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="commentaire">Commentaire (facultatif)</label>
            <input class="form-control" id="commentaire" maxlength="1000" th:field="*{commentaire}" type="text"
                   th:classappend="${#fields.hasErrors('commentaire')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{commentaire}">Erreur</div>
        </div>
        <div class="col-12 col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Enregistrer</button>
        </div>
    </form>

    <div class="text-muted" th:if="${#lists.isEmpty(consultees)}">
        Aucune offre consultée.
    </div>

    <div th:if="${!#lists.isEmpty(consultees)}">

        <div class="row g-2 fw-bold border-bottom pb-2 mb-2">
            <div class="col-12 col-md-1">🗓️ Date</div>
            <div class="col-12 col-md-4">Intitulé</div>
            <div class="col-12 col-md-2">Entreprise</div>
            <div class="col-12 col-md-1">Motif</div>
            <div class="col-12 col-md-3">Commentaire</div>
        </div>

        <div class="row g-2 align-items-center py-2 border-bottom" th:each="o : ${consultees}">
            <div class="col-12 col-md-1" style="font-size: 14px"
                 th:text="${#temporals.format(o.dateConsultation, 'dd/MM/yyyy')}">--</div>
            <div class="col-12 col-md-4">
                <a rel="noopener noreferrer" target="_blank" th:if="${o.lien != null}" th:href="${o.lien}"
                   th:text="${o.intitule} + ' ↗'">Intitulé</a>
                <span th:if="${o.lien == null}" th:text="${o.intitule}">Intitulé</span>
            </div>
            <div class="col-12 col-md-2" th:text="${o.entreprise}">Entreprise</div>
            <div class="col-12 col-md-1 text-nowrap" th:text="${o.motifLibelle}">Motif</div>
            <div class="col-12 col-md-3" th:text="${o.commentaire}">Commentaire</div>
            <div class="col-12 col-md-1">
                <div class="d-flex justify-content-md-end">
                    <form class="m-0" method="post" sec:authorize="hasRole('TITULAIRE')"
                          onsubmit="return confirm('Supprimer cette offre consultée ?');"
                          th:action="@{/consultees/{id}/supprimer(id=${o.id})}">
                        <button class="btn btn-outline-danger btn-sm" title="Supprimer" type="submit">🗑️</button>
                    </form>
                </div>
            </div>
        </div>

        <nav class="mt-3" th:if="${totalPages != null and totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/consultees(page=${currentPage - 1})}">Précédent</a>
                </li>
                <li class="page-item"
                    th:classappend="${p == currentPage} ? 'active'"
                    th:each="p : ${#numbers.sequence(1, totalPages)}">
                    <a class="page-link" th:href="@{/consultees(page=${p})}" th:text="${p}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/consultees(page=${currentPage + 1})}">Suivant</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="" th:src="@{/js/main.js}" type="text/javascript"></script>
</body>
</html>
