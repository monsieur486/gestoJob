spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: gestojob-webclient

  datasource:
    url: jdbc:postgresql://gestojob-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/master.xml

  mail:
    host: smtp.gmail.com
    port: 587
    # Hôte, port et propriétés SMTP partagés ; les identifiants propres à chaque
    # titulaire sont sous gestojob.mail (relus par MailConfiguration).

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${DOCKER_UI_PORT}
  # L'application tourne derrière un reverse proxy qui termine le HTTPS
  # (https://nomdedomaine.ext). On fait confiance aux en-têtes X-Forwarded-*
  # pour générer des URL/redirections en https et reconnaître le schéma réel.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

gestojob:
  # Boîtes Gmail d'envoi. Laurent est obligatoire ; Renée est facultative : sans
  # identifiant, elle ne peut simplement pas envoyer d'email depuis l'application.
  mail:
    laurent:
      username: ${MAIL_LAURENT_USERNAME}
      password: ${MAIL_LAURENT_PASSWORD}
    renee:
      username: ${MAIL_RENEE_USERNAME:}
      password: ${MAIL_RENEE_PASSWORD:}
  max-entreprises-par-page: ${MAX_ENTREPRISES_PAR_PAGE}
  max-annonces-par-page: ${MAX_ANNONCESS_PAR_PAGE}
  max-positifs-par-page: ${MAX_POSITIFS_PAR_PAGE}
  # Quatre comptes, sans valeur par défaut : laurent et renee sont titulaires
  # (lecture/écriture de leurs données), ft01 lit celles de Laurent, ft02 celles
  # de Renée (consultation seule).
  comptes:
    laurent:
      username: ${GESTOJOB_LAURENT_USERNAME}
      password: ${GESTOJOB_LAURENT_PASSWORD}
    renee:
      username: ${GESTOJOB_RENEE_USERNAME}
      password: ${GESTOJOB_RENEE_PASSWORD}
    ft01:
      username: ${GESTOJOB_FT01_USERNAME}
      password: ${GESTOJOB_FT01_PASSWORD}
    ft02:
      username: ${GESTOJOB_FT02_USERNAME}
      password: ${GESTOJOB_FT02_PASSWORD}

# --- Journal central ---------------------------------------------------------
#
# Facultatif : vides, le client d'émission est inerte et l'application démarre
# exactement comme avant.
#
# Le jeton est celui de la MACHINE (vm106-perso), partagé avec les autres
# applications de cette VM : côté journal, c'est le jeton qui fixe la provenance,
# et le champ « composant » qui distingue les applications entre elles.
configuration:
  journal:
    url: ${JOURNAL_URL:}
    jeton: ${JOURNAL_JETON:}
