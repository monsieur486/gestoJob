spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: gestojob-webclient

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/master.xml

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${DOCKER_UI_PORT}

gestojob:
  max-entreprises-par-page: ${MAX_ENTREPRISES_PAR_PAGE}
  max-annonces-par-page: ${MAX_ANNONCESS_PAR_PAGE}
  max-positifs-par-page: ${MAX_POSITIFS_PAR_PAGE}
  admin:
    username: ${GESTOJOB_ADMIN_USERNAME}
    password: ${GESTOJOB_ADMIN_PASSWORD}

# --- Journal central ---------------------------------------------------------
#
# Facultatif : vides, le client d'émission est inerte et l'application démarre
# exactement comme avant.
#
# Le jeton est celui de la MACHINE (vm106-perso), partagé avec les autres
# applications de cette VM : côté journal, c'est le jeton qui fixe la provenance,
# et le champ « composant » qui distingue les applications entre elles.
configuration:
  journal:
    url: ${JOURNAL_URL:}
    jeton: ${JOURNAL_JETON:}
