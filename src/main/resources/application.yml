spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: gestojob-webclient

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/master.xml

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${DOCKER_UI_PORT}
  # Fait lire X-Forwarded-For : sans ce réglage, l'application voit l'adresse de
  # Traefik (172.x) pour TOUS les clients. Les échecs de connexion journalisés
  # porteraient la même adresse pour tout le monde, et fail2ban finirait par
  # bannir le proxy — coupant les cinq sites de la machine d'un coup.
  #
  # C'est sûr ici parce que l'application ne publie aucun port : Traefik est le
  # seul à pouvoir l'atteindre, et personne ne peut donc forger cet en-tête.
  forward-headers-strategy: native

# --- Journal des échecs de connexion ------------------------------------------
# Fichier lu par fail2ban sur la machine d'accueil. En production, le conteneur
# monte /journaux depuis la VM ; la valeur par défaut ne sert qu'en dev.
journal:
  connexions:
    chemin: ${JOURNAL_CONNEXIONS:logs/connexions.log}

gestojob:
  max-entreprises-par-page: ${MAX_ENTREPRISES_PAR_PAGE}
  max-annonces-par-page: ${MAX_ANNONCESS_PAR_PAGE}
  max-positifs-par-page: ${MAX_POSITIFS_PAR_PAGE}
  # Quatre comptes, sans valeur par défaut : laurent et renee sont titulaires
  # (lecture/écriture de leurs données), ft01 lit celles de Laurent, ft02 celles
  # de Renée (consultation seule).
  comptes:
    laurent:
      username: ${GESTOJOB_LAURENT_USERNAME}
      password: ${GESTOJOB_LAURENT_PASSWORD}
    renee:
      username: ${GESTOJOB_RENEE_USERNAME}
      password: ${GESTOJOB_RENEE_PASSWORD}
    ft01:
      username: ${GESTOJOB_FT01_USERNAME}
      password: ${GESTOJOB_FT01_PASSWORD}
    ft02:
      username: ${GESTOJOB_FT02_USERNAME}
      password: ${GESTOJOB_FT02_PASSWORD}

# --- Journal central ---------------------------------------------------------
#
# Facultatif : vides, le client d'émission est inerte et l'application démarre
# exactement comme avant.
#
# Le jeton est celui de la MACHINE (vm106-perso), partagé avec les autres
# applications de cette VM : côté journal, c'est le jeton qui fixe la provenance,
# et le champ « composant » qui distingue les applications entre elles.
configuration:
  journal:
    url: ${JOURNAL_URL:}
    jeton: ${JOURNAL_JETON:}
